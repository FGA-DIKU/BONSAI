[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai"
version = "2.1.0"
description = "A framework for processing and analyzing Electronic Health Records (EHR) data using transformer-based models."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Sebastian Llambias", email = "snl@di.ku.dk" },
    { name = "Mikkel Odgaard" },
    { name = "Maria Elkjær Montgomery" },
    { name = "Kiril Klein" },
    { name = "Stephan Sloth Lorenzen" },
]
keywords = ["EHR", "transformers", "healthcare", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=2.4.2",
    "lightning==2.6.1",
    "matplotlib>=3.10.0",
    "hydra-core>=1.3.2",
    "polars==1.38.1",
    "pyarrow>=23.0.1",
    "PyYAML>=6.0.3",
    "scikit-learn>=1.8.0",
    "torch==2.10.0",
    "tqdm==4.67.3",
    "xgboost>=3.0.2",
    "ruff==0.15.1",
    "dotenv==0.9.9",
]

[tool.setuptools.packages.find]
include = ["bonsai", "bonsai.*"]

[project.optional-dependencies]
dev = [
    "ruff",
    "docstr-coverage",
    "coverage",
]
flash_attn = [
    "packaging==25.0",
    "psutil==7.2.0",
    "ninja==1.13.0",
    "flash-attn==2.8.3", # requires GCC version >=9
]

[project.urls]
Homepage = "https://github.com/FGA-DIKU/EHR"
Source = "https://github.com/FGA-DIKU/EHR"
Tracker = "https://github.com/FGA-DIKU/EHR/issues"

