[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai"
version = "1.0.0"
description = "A framework for processing and analyzing Electronic Health Records (EHR) data using BERT-based models."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Kiril Klein", email = "kikl@di.ku.dk" },
    { name = "Mikkel Odgaard" },
    { name = "Stephan Sloth Lorenzen" },
    { name = "Maria Elkjær Montgomery" },
]
keywords = ["EHR", "BERT", "healthcare", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "PyYAML>=6.0.3",
    "scikit-learn>=1.8.0",
    "torch==2.10.0",
    "tqdm==4.67.3",
    "transformers>=4.48.2",
    "xgboost>=3.0.2",
    "ruff==0.15.1",
]

[tool.setuptools.packages.find]
include = ["bonsai", "bonsai.*"]

[project.optional-dependencies]
dev = [
    "ruff",
    "docstr-coverage",
    "coverage",
]

[project.urls]
Homepage = "https://github.com/FGA-DIKU/EHR"
Source = "https://github.com/FGA-DIKU/EHR"
Tracker = "https://github.com/FGA-DIKU/EHR/issues"

