run_id: ${version:}
hardware:
  accelerator: auto
  num_nodes: 1
  num_devices: 1
  num_workers: 6
  precision: bf16-mixed
  strategy: auto
  compile_mode: default
dataset: correlated_MEDS_data
paths:
  dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}
  train_split: ${paths.dir}/subject_data_train.pt
  val_split: ${paths.dir}/subject_data_tuning.pt
  vocab: ${paths.dir}/vocabulary.pt
  dataset_class: bonsai.modules.datasets.PretrainDataset.ARPretrainDataset
  population: ${paths.dir}/population_full.csv
  ckpt_path: null
training:
  max_len: 10
  batch_size: 2
  accumulate_grad_batches: 1
  epochs: 10
  loss_fn: CE
  learning_rate: 0.0003
  optimizer_epsilon: 1.0e-06
  scheduler_warmup_epochs: 1
  limit_val_batches: 10
  limit_train_batches: 10
  value_loss_weight: 1.0
  ckpt_every_n_epoch: 1
  cutoff_date: null
model:
  _target_: bonsai.modules.networks.bonsai_nets.BonsaiPretrain
  max_seqlen: ${training.max_len}
  hidden_size: 64
  num_layers: 4
  num_attention_heads: 4
  dropout: 0.1
  attention_dropout: 0.0
  bias: false
  causal: true
  attn_type: sdpa
lightning_module:
  _target_: bonsai.modules.lightningmodules.PretrainModule.PretrainModule
