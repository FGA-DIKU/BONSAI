hardware:
  accelerator: auto
  num_nodes: 1
  num_devices: 1
  num_workers: 6
  precision: bf16-mixed
  strategy: auto
  compile_mode: default
dataset: correlated_MEDS_data
paths:
  dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}
  train_split: ${paths.dir}/subject_data_train.pt
  val_split: ${paths.dir}/subject_data_tuning.pt
  vocab: ${paths.dir}/vocabulary.pt
  dataset_class: bonsai.modules.datasets.PretrainDataset.ARPretrainDataset
  population: ${paths.dir}/population.csv
training:
  max_len: 10
  cutoff_date:
    day: 1
    month: 1
    year: 2015
  batch_size: 32
  accumulate_grad_batches: 2
  epochs: 1
  learning_rate: 0.0005
  optimizer_epsilon: 1.0e-06
  scheduler_warmup_epochs: 2
  limit_val_batches: 1.0
  limit_train_batches: 1.0
  ckpt_every_n_epoch: 1
model:
  hidden_size: 96
  num_hidden_layers: 3
  num_attention_heads: 3
  intermediate_size: 64
  embedding_dropout: 0.1
  max_position_embeddings: 8192
  age_scale: 0.01
  abspos_scale: 1.0e-05
  age_shift: -50
  abspos_shift: -90000
  is_causal: false
metrics:
  top1:
    _target_: corebehrt.modules.monitoring.metrics.PrecisionAtK
    topk: 1
  top10:
    _target_: corebehrt.modules.monitoring.metrics.PrecisionAtK
    topk: 10
  mlm_loss:
    _target_: corebehrt.modules.monitoring.metrics.LossAccessor
    loss_name: loss
