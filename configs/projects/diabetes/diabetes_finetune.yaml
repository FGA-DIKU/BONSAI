# @package _global_
defaults:
  - /finetune@_global_
  - _self_

dataset: phair_light_MEDS_data
outcome: projects/diabetes/diabetes-su_hypo
pretrain_path: [INSERT PATH TO PRETRAINED MODEL CHECKPOINT HERE]

paths:
  ckpt_path: null

labels:
  start_include:
    days: 7
    hours: 0
  end_include:
    days: 365

training:
  epochs: 20
  learning_rate: 3e-4
  limit_val_batches: 1.0
  limit_train_batches: 1.0
  eval_monitor_metric: val/AUROC
  eval_monitor_mode: max

model:
  attn_type: flash
