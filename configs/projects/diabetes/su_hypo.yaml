# @package _global_
defaults:
  - ../core/base_create@
  - _self_

dataset: phair_light

paths: 
  input_dir: FILL_OUT_THIS/${dataset}
  save_path: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}/outcomes/${hydra:job.config_name}.parquet

splits:
  - train
  - tuning
  - held_out

outcome:
  exclude: # OPTIONAL
    dependence: independent # independent/dependent
    conditions:
      - col: code
        vals: [ DIAGNOSIS//DE160, DIAGNOSIS//DE161, DIAGNOSIS//DE162 ]
  outcome:
    dependence: independent # independent/dependent
    conditions:
      - col: code
        vals: [ DIAGNOSIS//DE160, DIAGNOSIS//DE161, DIAGNOSIS//DE162 ]

  index:
    type: exposure # absolute/relative/exposure
    dependence: independent # exposure
    conditions: 
      - col: code
        vals: [ MEDICATION//MA10BB ]

  censor: # ALWAYS RELATIVE TO INDEX
    relative_hour_shift: 0 # 0 sets index=censor