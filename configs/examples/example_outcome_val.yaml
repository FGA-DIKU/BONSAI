# @package _global_
defaults:
  - /core/base_create@
  - _self_

dataset: correlated_MEDS_data

paths: 
  input_dir: example_data/${dataset}
  save_path: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}/outcomes/${hydra:job.config_name}.parquet

splits:
  - train
  - tuning
  - held_out

  

outcome:
  exclude: # OPTIONAL

  outcome:
    dependence: independent # independent/dependent
    conditions:
      - column: code
        value: [ SYN//Negative ]
        operator: in # in/startswith_any

  index:
    type: absolute # absolute/relative/exposure
    absolute_date: # absolute
      year: 2023
      month: 1
      day: 1
    relative_shift: 
      hours: 0
    dependence: # exposure
    conditions: # exposure

  censor: # ALWAYS RELATIVE TO INDEX
    relative_shift: 
      hours: 0 # 0 sets index=censor
