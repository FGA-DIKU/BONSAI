# @package _global_
defaults:
  - /core/base_create@
  - _self_

dataset: correlated_MEDS_data

paths: 
  input_dir: example_data/${dataset}
  save_path: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}/outcomes/${hydra:job.config_name}.parquet

splits:
  - train
  - tuning
  - held_out

index:
  missing: drop
  seed: 42
  conditional_criteria:
    - action: overwrite
      mode: add_column
      args:
        name: index_date
        value: "2023-01-01"
        dtype: datetime
    - action: overwrite
      mode: first
      args:
        col: index_date

outcome:
  conditional_criteria:
    - action: append
      mode: reference
      args:
        name: index_dates
    - action: overwrite
      mode: match
      args:
        dependence: same_row
        conditions:
          - column: code
            value: &outcome_codes [ SYN//Negative ]
            operator: in
          - column: time
            operator: ge
            value_col: index_date
    - action: overwrite
      mode: first
      args:
        col: time
    - action: overwrite
      mode: rename
      args:
        time: outcome_date

censor:
  conditional_criteria:
    - action: overwrite
      mode: reference
      args:
        name: index_dates
    - action: overwrite
      mode: rename
      args:
        index_date: censor_date

cohort:
  conditional_criteria:
    - action: append
      mode: reference
      args:
        name: index_dates
    - action: exclude  # outcomes prior to index
      mode: match
      args:
        dependence: same_row
        conditions:
          - column: code
            value: *outcome_codes
            operator: in
          - column: time
            operator: lt
            value_col: index_date