# @package _global_
defaults: 
  - ../pretrain@
  - ../hardware/1gpu6cpu@hardware
  - _self_

training:
  max_len: 512
  batch_size: 2
  epochs: 10
  loss_fn: CodeValue
  loss_params:
    value_loss_weight: 1.0
  limit_val_batches: 10
  limit_train_batches: 10
  value_loss_weight: 1.0

paths:
  dataset_class: bonsai.modules.datasets.PretrainDataset.ValueARPretrainDataset

lightning_module:
  _target_: bonsai.modules.lightningmodules.PretrainModule.ValuePretrainModule

model:
  _target_: bonsai.modules.networks.bonsai_nets.BonsaiValuePretrain
  value_embedding_mode: film
