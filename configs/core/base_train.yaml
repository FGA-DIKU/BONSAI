hydra:
  verbose: false
  output_subdir: hydra
  job:
    env_set:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  run:
    dir: ${oc.env:BONSAI_MODELS}/${dataset}/${hydra:job.config_name}/run_id_${run_id}
  sweep:
    dir: ${oc.env:BONSAI_MODELS}/${dataset}
    subdir: ${hydra:job.config_name}/run_id_${run_id}

run_id: ${version:}