defaults: 
  - core/base_train@
  - hardware/1gpu6cpu@hardware
  - _self_
  
dataset: 

paths:
  dir: ${oc.env:BONSAI_PROCESSED_DATA}/${dataset}
  train_split: ${paths.dir}/subject_data_train.pt
  val_split: ${paths.dir}/subject_data_tuning.pt
  vocab: ${paths.dir}/vocabulary.pt
  dataset_class: bonsai.modules.datasets.PretrainDataset.ARPretrainDataset # or MLMPretrainDataset
  population: ${paths.dir}/population_full.csv
  ckpt_path: 

training:
  max_len: 8192
  batch_size: 128
  accumulate_grad_batches: 1
  epochs: 10
  learning_rate: 3e-4
  optimizer_epsilon: 1e-6
  scheduler_warmup_epochs: 1
  limit_val_batches: 1.0
  limit_train_batches: 1.0
  ckpt_every_n_epoch: 1
  cutoff_date: # Optional
  #   day: 1
  #   month: 1
  #   year: 2015
  # MLM specific
  # masking:
  #   masking_select_ratio: 1.
  #   masking_mask_ratio: .8
  #   masking_random_ratio: .1
  #   masking_ignore_special_tokens: true

model:
  max_seqlen: ${training.max_len}
  hidden_size: 64
  num_layers: 4
  num_attention_heads: 4
  dropout: 0.1
  attention_dropout: 0.0
  bias: false
  causal: false
  attn_type: sdpa


#scheduler:
  #_target_: transformers.get_linear_schedule_with_warmup
  #num_warmup_epochs: 2
  #num_training_epochs: 3

metrics:
  top1:
    _target_: corebehrt.modules.monitoring.metrics.PrecisionAtK
    topk: 1
  top10:
    _target_: corebehrt.modules.monitoring.metrics.PrecisionAtK
    topk: 10
  mlm_loss:
    _target_: corebehrt.modules.monitoring.metrics.LossAccessor
    loss_name: loss
